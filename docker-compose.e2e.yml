services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: apppass
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpass"]
      interval: 3s
      timeout: 5s
      retries: 30

  wiremock:
    image: wiremock/wiremock:3.13.0
    ports:
      - "8089:8080"
    volumes:
      - ./e2e-fixtures/wiremock:/home/wiremock
    command: ["--global-response-templating", "--verbose"]
