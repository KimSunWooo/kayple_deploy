# Kayple reservation — place/symlink as /etc/nginx/sites-available/default
# Backup existing config before replacing.
# Certificates already issued at /etc/letsencrypt/live/ksw.recruit.kayple.com/

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name ksw.recruit.kayple.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name ksw.recruit.kayple.com;

    ssl_certificate     /etc/letsencrypt/live/ksw.recruit.kayple.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ksw.recruit.kayple.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/html;
    index index.html;

    # Spring Boot API
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
    }

    # React SPA — direct URL fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
